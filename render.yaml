services:
  - type: web
    name: yasnodogovor-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm run release && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: UPLOAD_DIR
        value: ./uploads
      - key: FREE_ANALYSES_PER_MONTH
        value: 3
      - key: DATABASE_URL
        fromDatabase:
          name: contract-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false

databases:
  - name: contract-db
    plan: free
    region: frankfurt
