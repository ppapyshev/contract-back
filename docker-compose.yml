services:
  postgres:
    image: postgres:16-alpine
    container_name: contract-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: contract
      POSTGRES_PASSWORD: contract
      POSTGRES_DB: contract_db
    volumes:
      - contract_pg_data:/var/lib/postgresql/data

volumes:
  contract_pg_data:
